name: Firebase CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint, format and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  deploy:
    name: Deploy Firebase Spark
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: firebase-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure frontend
        env:
          WEB_ENV: ${{ secrets.BROADCAST_WEB_ENV }}
        run: |
          test -n "$WEB_ENV" || { echo 'BROADCAST_WEB_ENV is missing'; exit 1; }
          umask 077
          printf '%s\n' "$WEB_ENV" > web/.env.local
      - name: Build production frontend
        env:
          VITE_ENABLE_FUNCTIONS: 'false'
          VITE_USE_FIREBASE_EMULATORS: 'false'
        run: npm run build -w web
      - name: Authenticate to Firebase
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: broadcast-68476
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy Hosting, Firestore rules and indexes
        run: npx --no-install firebase deploy --project broadcast-68476 --only firestore,hosting --non-interactive
      - name: Remove frontend configuration
        if: always()
        run: rm -f web/.env.local
